[workspace]
resolver = "2"
members = [
    "core",
    "parser",
    "compiler",
    "cli",
    "lsp",
    "daemon",
    "network/commons",
    "simulator",
    "tui",
    "agent",
    "cloud",
    "enterprise",
    "desktop/src-tauri"
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
winnow = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-lsp = "0.20.0"
notify = "6.1.1"
reqwest = { version = "0.11", features = ["json"] }
ratatui = "0.26.0"
crossterm = "0.27.0"
